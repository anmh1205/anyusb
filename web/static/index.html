<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyUSB</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div><h1>AnyUSB</h1><p id="agent"></p></div><button id="refresh" type="button">Refresh</button></header>
  <main>
    <p id="notice" role="status"></p>
    <section aria-labelledby="devices-title">
      <h2 id="devices-title">Local devices</h2>
      <div class="table"><table><thead><tr><th>Device</th><th>Bus ID</th><th>Lease holder</th><th>Sharing</th></tr></thead><tbody id="local"></tbody></table></div>
    </section>
    <section aria-labelledby="peer-title">
      <h2 id="peer-title">Peers</h2>
      <form id="pair">
        <label>Address <input name="endpoint" required placeholder="hostname or IP"></label>
        <label>Pairing code <input name="code" required pattern="[0-9]{8}" inputmode="numeric" maxlength="8"></label>
        <button>Pair</button><button id="invite" type="button">Create code</button><button id="discover" type="button">Discover LAN</button>
      </form>
      <p id="invite-code" aria-live="polite"></p>
      <ul id="discoveries"></ul>
    </section>
    <section aria-labelledby="remote-title">
      <div class="section-title"><h2 id="remote-title">Remote devices</h2><label>Peer <select id="peer"></select></label></div>
      <div class="table"><table><thead><tr><th>Device</th><th>USB status</th><th>Lease holder</th><th>Actions</th></tr></thead><tbody id="remote"></tbody></table></div>
    </section>
    <section aria-labelledby="esp-title">
      <div class="section-title"><h2 id="esp-title">Remote ESP</h2><span id="target">Select a remote device</span></div>
      <form id="esp-form">
        <label>Host serial port <input name="port" placeholder="Auto"></label>
        <label>Baud <input name="baud" type="number" min="300" max="4000000" value="115200"></label>
        <button type="button" data-op="chip-id">Chip ID</button><button type="button" data-op="reset">Reset</button>
        <button type="button" data-op="erase">Erase</button><button id="monitor" type="button">Open monitor</button>
        <fieldset><legend>Firmware</legend>
          <label>ESP-IDF manifest <input name="manifest" type="file" accept=".json"></label>
          <label>Firmware files <input name="firmware" type="file" accept=".bin" multiple></label>
          <label>Offset for a single file <input name="offset" value="0x0"></label>
          <button type="button" data-op="flash">Flash</button><button type="button" data-op="verify">Verify</button>
        </fieldset>
      </form>
      <pre id="logs" aria-live="off"></pre>
      <form id="serial">
        <label>Serial input <input name="text" autocomplete="off"></label>
        <button>Send</button><label class="check"><input name="dtr" type="checkbox"> DTR</label>
        <label class="check"><input name="rts" type="checkbox"> RTS</label><button id="apply-serial" type="button">Apply baud and signals</button>
      </form>
    </section>
    <section aria-labelledby="doctor-title">
      <div class="section-title"><h2 id="doctor-title">Diagnostics</h2><button type="button" id="doctor">Run diagnostics</button></div>
      <ul id="checks"></ul>
    </section>
  </main>
</body>
</html>
